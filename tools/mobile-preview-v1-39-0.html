<!doctype html>
<html lang="hu">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Csanádi – reszponzív ellenőrzés</title>
 <style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#081b2f;color:#edf3fb}
  *{box-sizing:border-box}body{margin:0;padding:14px 20px 24px}
  .toolbar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  button{padding:9px 14px;border:1px solid #bd9b62;border-radius:20px;background:#203950;color:#fff;cursor:pointer}
  button[aria-pressed=true]{background:#be9a5d;color:#101c2d;font-weight:800}
  label{margin-left:10px;font-size:13px}.stage{display:flex;justify-content:center;min-width:0}
  iframe{height:calc(100vh - 98px);max-width:100%;background:#fff;border:2px solid #d7b271;border-radius:17px;box-shadow:0 12px 45px #0008}
 </style>
</head>
<body>
 <div class="toolbar" role="group" aria-label="Nézetméret kiválasztása">
  <strong>Telefonos ellenőrző nézet</strong>
  <button type="button" data-width="320">320 px</button>
  <button type="button" data-width="375">375 px</button>
  <button type="button" data-width="390" aria-pressed="true">390 px</button>
  <button type="button" data-width="768">768 px</button>
  <label for="path">Útvonal</label>
  <select id="path"><option value="#/">Kezdőoldal</option><option value="#/megkozelites-es-erkezes">Megközelítés</option><option value="#/megkozelites-es-erkezes/terkep">Térkép</option><option value="#/oktatas/digitalis-kultura">Digitális kultúra</option><option value="#/hirek-es-esemenyek/hirek">Hírek</option></select>
 </div>
 <div class="stage"><iframe id="view" title="Reszponzív honlapnézet" width="390" src="../index.html#/" loading="eager"></iframe></div>
 <script>
  const view=document.getElementById('view');
  const buttons=[...document.querySelectorAll('button[data-width]')];
  for(const button of buttons)button.addEventListener('click',()=>{
   view.width=button.dataset.width;
   for(const item of buttons)item.setAttribute('aria-pressed',String(item===button));
  });
  document.getElementById('path').addEventListener('change',event=>{view.src='../index.html'+event.target.value;});
 </script>
</body>
</html>
